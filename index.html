<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Number Ninja 🔢</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;

    font-family: Arial, sans-serif;

    background: linear-gradient(135deg, #101b2d, #28506b);

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: min(700px, 100%);

    text-align: center;

    background: rgba(255,255,255,0.08);

    padding: 28px;

    border-radius: 25px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.35);
}

h1 {
    margin: 0 0 5px;
    font-size: 40px;
}

.subtitle {
    opacity: 0.8;
    margin-bottom: 20px;
}

.stats {
    display: flex;
    justify-content: space-around;

    gap: 10px;

    margin: 15px 0;
}

.stat {
    background: rgba(255,255,255,0.1);

    padding: 10px 15px;

    border-radius: 14px;

    min-width: 100px;
}

.stat b {
    display: block;

    font-size: 22px;

    margin-top: 4px;
}

#message {
    min-height: 30px;

    font-weight: bold;

    margin: 15px;
}

#target {
    font-size: 48px;

    font-weight: bold;

    margin: 20px 0;
}

#numbers {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 12px;

    margin: 20px auto;

    max-width: 550px;
}

.number {

    width: 85px;

    height: 70px;

    border: none;

    border-radius: 15px;

    background: #607d9b;

    color: white;

    font-size: 25px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.12s,
        background 0.15s;
}

.number:hover {

    transform: scale(1.05);
}

.number.selected {

    background: #67e8f9;

    color: #10152d;
}

#current {

    font-size: 20px;

    margin: 15px;
}

#timer {

    font-size: 18px;

    font-weight: bold;

    margin: 10px;
}

#submit,
#start {

    border: none;

    border-radius: 12px;

    padding: 13px 25px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    background: white;

    color: #171b38;

    margin: 8px;
}

button:disabled {

    opacity: 0.5;

    cursor: not-allowed;
}

.info {

    font-size: 13px;

    opacity: 0.65;

    margin-top: 15px;
}

</style>
</head>

<body>

<div class="game">

    <h1>🔢 Number Ninja</h1>

    <div class="subtitle">
        Choose numbers that add up to the target!
    </div>

    <div class="stats">

        <div class="stat">
            Round
            <b id="round">0/10</b>
        </div>

        <div class="stat">
            Score
            <b id="score">0</b>
        </div>

        <div class="stat">
            Lives
            <b id="lives">❤️❤️❤️</b>
        </div>

    </div>

    <div id="message">
        Press Start to begin!
    </div>

    <div id="target">
        🎯
    </div>

    <div id="numbers"></div>

    <div id="current">
        Selected: 0
    </div>

    <div id="timer">
        Time: 15
    </div>

    <button id="submit" disabled>
        Check Answer
    </button>

    <br>

    <button id="start">
        Start Game
    </button>

    <div class="info">
        This game focuses on numerical reasoning and problem solving.
    </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const targetDisplay =
    document.getElementById("target");

const numbersContainer =
    document.getElementById("numbers");

const message =
    document.getElementById("message");

const roundDisplay =
    document.getElementById("round");

const scoreDisplay =
    document.getElementById("score");

const livesDisplay =
    document.getElementById("lives");

const currentDisplay =
    document.getElementById("current");

const timerDisplay =
    document.getElementById("timer");

const startButton =
    document.getElementById("start");

const submitButton =
    document.getElementById("submit");


/* =========================
   GAME VARIABLES
========================= */

let round = 0;

let score = 0;

let lives = 3;

let target = 0;

let numbers = [];

let selected = [];

let playing = false;

let timeLeft = 15;

let timer = null;

let nextRoundTimeout = null;


/* =========================
   START GAME
========================= */

function startGame() {

    clearInterval(timer);

    clearTimeout(nextRoundTimeout);

    round = 1;

    score = 0;

    lives = 3;

    scoreDisplay.textContent = "0";

    livesDisplay.textContent =
        "❤️❤️❤️";

    roundDisplay.textContent =
        "1/10";

    startButton.disabled = true;

    startButton.textContent =
        "Playing...";

    message.textContent =
        "🥷 Get ready!";

    playing = false;

    setTimeout(function() {

        newRound();

    }, 700);
}


/* =========================
   NEW ROUND
========================= */

function newRound() {

    clearInterval(timer);

    clearTimeout(nextRoundTimeout);

    /*
       THIS IS IMPORTANT.
       Every new round starts with
       the game ACTIVE.
    */

    playing = true;

    selected = [];

    numbers = [];

    numbersContainer.innerHTML = "";

    submitButton.disabled = true;

    currentDisplay.textContent =
        "Selected: 0";


    /* -------------------------
       CREATE NUMBERS
    ------------------------- */

    let maxNumber =
        10 + (round - 1) * 3;


    for (let i = 0; i < 5; i++) {

        numbers.push(
            Math.floor(
                Math.random() * maxNumber
            ) + 1
        );

    }


    /* -------------------------
       CREATE TARGET
    ------------------------- */

    let first =
        Math.floor(
            Math.random() * numbers.length
        );

    let second =
        Math.floor(
            Math.random() * numbers.length
        );


    while (second === first) {

        second =
            Math.floor(
                Math.random() * numbers.length
            );
    }


    target =
        numbers[first] +
        numbers[second];


    /*
       Later rounds can require
       three numbers.
    */

    if (round >= 7) {

        let third =
            Math.floor(
                Math.random() * numbers.length
            );


        while (
            third === first ||
            third === second
        ) {

            third =
                Math.floor(
                    Math.random() * numbers.length
                );
        }


        target += numbers[third];
    }


    targetDisplay.textContent =
        target;


    /* -------------------------
       CREATE NUMBER BUTTONS
    ------------------------- */

    numbers.forEach(function(number, index) {

        const button =
            document.createElement("button");


        button.className =
            "number";


        button.textContent =
            number;


        /*
           DIRECT CLICK EVENT.
           This stays active for the
           entire round.
        */

        button.onclick = function() {

            chooseNumber(index, button);

        };


        numbersContainer.appendChild(button);

    });


    message.textContent =
        "Find the numbers that make the target!";


    startTimer();
}


/* =========================
   CHOOSE NUMBER
========================= */

function chooseNumber(index, button) {

    if (!playing) {
        return;
    }


    /*
       Don't allow the same number
       button to be selected twice.
    */

    if (selected.includes(index)) {
        return;
    }


    selected.push(index);


    button.classList.add("selected");


    let total = 0;


    selected.forEach(function(i) {

        total += numbers[i];

    });


    currentDisplay.textContent =
        "Selected: " + total;


    submitButton.disabled = false;


    if (total > target) {

        message.textContent =
            "⚠️ Too high!";

    }

    else if (total === target) {

        message.textContent =
            "🎯 Perfect! Tap Check Answer!";

    }

    else {

        message.textContent =
            "Keep going...";
    }
}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer() {

    if (!playing) {
        return;
    }


    let total = 0;


    selected.forEach(function(i) {

        total += numbers[i];

    });


    /* -------------------------
       CORRECT
    ------------------------- */

    if (total === target) {

        playing = false;

        clearInterval(timer);

        submitButton.disabled = true;


        let points =
            100 +
            (timeLeft * 5) +
            (round * 20);


        score += points;


        scoreDisplay.textContent =
            score;


        message.textContent =
            "🎉 Correct! +" +
            points +
            " points";


        /*
           FINISH AFTER ROUND 10
        */

        if (round >= 10) {

            nextRoundTimeout =
                setTimeout(function() {

                    finishGame();

                }, 1000);

            return;
        }


        /*
           MOVE TO NEXT ROUND
        */

        nextRoundTimeout =
            setTimeout(function() {

                round++;

                roundDisplay.textContent =
                    round + "/10";

                newRound();

            }, 1000);

    }


    /* -------------------------
       WRONG
    ------------------------- */

    else {

        loseLife();

    }
}


/* =========================
   LOSE LIFE
========================= */

function loseLife() {

    lives--;


    livesDisplay.textContent =
        "❤️".repeat(lives) +
        "🖤".repeat(3 - lives);


    selected = [];


    document
        .querySelectorAll(".number")
        .forEach(function(button) {

            button.classList.remove("selected");

        });


    currentDisplay.textContent =
        "Selected: 0";


    submitButton.disabled = true;


    if (lives <= 0) {

        playing = false;

        clearInterval(timer);

        message.textContent =
            "💥 Game over!";


        setTimeout(function() {

            finishGame();

        }, 1000);


        return;
    }


    message.textContent =
        "❌ Wrong! Try another combination.";
}


/* =========================
   TIMER
========================= */

function startTimer() {

    clearInterval(timer);


    timeLeft =
        Math.max(
            7,
            15 - Math.floor((round - 1) / 2)
        );


    timerDisplay.textContent =
        "Time: " + timeLeft;


    timer =
        setInterval(function() {

            if (!playing) {

                clearInterval(timer);

                return;
            }


            timeLeft--;


            timerDisplay.textContent =
                "Time: " + timeLeft;


            if (timeLeft <= 0) {

                clearInterval(timer);

                message.textContent =
                    "⏰ Time's up!";

                loseLife();


                if (lives > 0) {

                    /*
                       Give the player a fresh
                       puzzle after time runs out.
                    */

                    setTimeout(function() {

                        newRound();

                    }, 700);
                }
            }

        }, 1000);
}


/* =========================
   FINISH GAME
========================= */

function finishGame() {

    playing = false;

    clearInterval(timer);

    clearTimeout(nextRoundTimeout);


    numbersContainer.innerHTML = "";


    targetDisplay.textContent =
        "🏆";


    currentDisplay.textContent =
        "";


    timerDisplay.textContent =
        "";


    message.textContent =
        "🏆 Game complete! Final score: " +
        score;


    startButton.disabled = false;

    startButton.textContent =
        "Play Again";


    submitButton.disabled = true;
}


/* =========================
   START BUTTON
========================= */

startButton.onclick =
    startGame;


/* =========================
   CHECK ANSWER BUTTON
========================= */

submitButton.onclick =
    checkAnswer;

</script>

</body>
</html>
